services:
  mlflow:   # Servicio 0: Servidor de MLflow
    image: ghcr.io/mlflow/mlflow:v3.12.0 # imagen oficial de MLflow, fijada a la misma versión que el cliente (requirements.txt)
    container_name: mlflow_server #nombre del contenedor
    ports:
      - "5000:5000" 
    volumes:
      - ../artifacts/mlruns:/app/mlruns
    environment:
      - MLFLOW_HTTP_WHITELIST=* #Permite peticiones HTTP sin restricciones
      - MLFLOW_ALLOW_FILE_STORE=true
    # Metadatos en SQLite (backend moderno) y artefactos en /app/mlruns, accesible desde fuera del contenedor
    command: mlflow server --backend-store-uri sqlite:////app/mlruns/mlflow.db --default-artifact-root file:///app/mlruns --host 0.0.0.0 --port 5000 --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000


  train:   # Servicio 1: Entrenamiento (perfil "train": NO arranca con un `up` normal)
    profiles: ["train"]
    build:
    # crea una imagen dockerfile
      context: ..
      dockerfile: infra/Dockerfile.train
    volumes:
    # monta los directorios del host en el contenedor (no es una copia sino una referencia)
      - ../artifacts/models:/app/models 
      - ../artifacts/mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000 #los clientes hablan con el servidor; solo él toca la DB
      - MLFLOW_ALLOW_FILE_STORE=true
      - N_TRIALS=${N_TRIALS:-10} #nº de trials de Optuna (bajo para arranques rápidos)
      - PYTHONUNBUFFERED=1
    depends_on:
      - mlflow

  # Servicio 2: API
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ../artifacts/models:/app/models
      - ../artifacts/mlruns:/app/mlruns
      - ../data:/app/data
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      mlflow:
        condition: service_started

  # Servicio 4: Frontend (estático)
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro

  # Servicio 3: Monitor
  monitor:
      build:
        context: ..
        dockerfile: infra/Dockerfile.monitor
      volumes:
        - ../data:/app/data
        - ../backend/src:/app/src
        - ../artifacts/models:/app/models
        - ../artifacts/mlruns:/app/mlruns  
      environment:
        - MLFLOW_TRACKING_URI=http://mlflow:5000
        - MLFLOW_ALLOW_FILE_STORE=true
        - PYTHONUNBUFFERED=1
        - API_RELOAD_URL=http://api:8000/reload
      depends_on:
        - api